name: Inspect content labels

on:
  push:
    paths:
      - '.github/workflows/inspect-content-labels.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant UI contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['リトライノート','準1級','2級','grade','select']:
              print('\n###', needle)
              start=0
              count=0
              while True:
                  i=s.find(needle,start)
                  if i<0 or count>=12: break
                  print(repr(s[max(0,i-220):i+320]))
                  start=i+len(needle)
                  count+=1
              print('count shown:',count)
          PY

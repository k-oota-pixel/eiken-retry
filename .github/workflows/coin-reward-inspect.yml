name: Inspect retry coin hook

on:
  push:
    paths:
      - '.github/workflows/coin-reward-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract likely answer hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          patterns=[
            r'onsubmit', r'addEventListener\(["\']submit', r'recordAttempt', r'lastAttempt',
            r'questionId', r'currentQuestion', r'checkAnswer', r'submitAnswer', r'judge',
            r'\.total', r'correct', r'firebase', r'Firestore', r'save'
          ]
          out=[]
          seen=[]
          for pat in patterns:
            matches=list(re.finditer(pat,s,re.I))[:12]
            for m in matches:
              start=max(0,m.start()-650); end=min(len(s),m.end()+950)
              key=(start,end)
              if any(abs(start-a)<200 for a,b in seen):
                continue
              seen.append(key)
              chunk=s[start:end]
              out.append(f'\n===== PATTERN {pat!r} @ {m.start()} =====\n{chunk}\n')
              if len(out)>=45:
                break
            if len(out)>=45:
              break
          Path('.coin-retry-inspect.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coin-retry-inspect.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add retry hook inspection output"
          git push

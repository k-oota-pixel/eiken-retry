name: Remove retry footer disclaimer

on:
  push:
    paths:
      - '.github/workflows/remove-footer-disclaimer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove footer disclaimer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          target='英検の過去問題を使った個人学習用ツールです。日本英語検定協会の公式サービスではありません。'
          if target not in s:
              raise SystemExit('target disclaimer not found')
          s=s.replace(target,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove retry footer disclaimer"
          git push

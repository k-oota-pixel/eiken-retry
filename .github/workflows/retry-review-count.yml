name: Retry review question count checks
on:
  push:
    paths:
      - 'assets/trainer-core.js'
      - 'assets/retry-app.js'
      - 'index.html'
      - 'tests/retry-review-count.test.cjs'
      - '.github/workflows/retry-review-count.yml'
  pull_request:
    paths:
      - 'assets/trainer-core.js'
      - 'assets/retry-app.js'
      - 'index.html'
      - 'tests/retry-review-count.test.cjs'
      - '.github/workflows/retry-review-count.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/trainer-core.js && node --check assets/retry-app.js
      - run: node --test tests/retry-review-count.test.cjs

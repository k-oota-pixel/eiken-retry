name: Apply retry coin rewards

on:
  push:
    paths:
      - '.github/workflows/coin-reward-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch retry notebook coin rewards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script type="module" src="https://k-oota-pixel.github.io/english-playroom/coin-reward.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          needle="if(C.answer(state,q,Number(b.dataset.choice))){persist();render();loadLearningHelp(q);announceNewAwards(beforeAwards);}return;"
          repl="if(C.answer(state,q,Number(b.dataset.choice))){persist();render();loadLearningHelp(q);announceNewAwards(beforeAwards);window.EnglishPlayroomCoins?.recordRetryAttempt?.(q.id);}return;"
          if 'recordRetryAttempt?.(q.id)' not in s:
              if needle not in s: raise SystemExit('answer hook target not found')
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect retry notebook to shared coin rewards"
          git push

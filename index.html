nswer_status":"official","answer_source":"https://www.eiken.or.jp/eiken/result/pdf/202501Fp1kyu.pdf","source_file":"問題冊子(20261011-053921).pdf","source_page":4},{"id":"2025-1-pre1-q11","grade":"準1級","year":2025,"session":1,"section":1,"question_number":11,"question":"Christine loved (____) colors, so she filled her apartment with bright red, yellow, and orange furnishings.","choices":[{"number":1,"text":"vivid"},{"number":2,"text":"weary"},{"number":3,"text":"hazy"},{"number":4,"text":"feeble"}],"answer_number":1,"answer_text":"vivid","answer_status":"official","answer_source":"https://www.eiken.or.jp/eiken/result/pdf/202501Fp1kyu.pdf","source_file":"問題冊子(20261011-053921).pdf","source_page":4},{"id":"2025-1-pre1-q12","grade":"準1級","year":2025,"session":1,"section":1,"question_number":12,"question":"Although Jeffrey claimed it was an accident, Gretchen believed that he (____) knocked her books to the floor in order to make her angry.","choices":[{"number":1,"text":"greedily"},{"number":2,"text":"obediently"},{"number":3,"text":"intentionally"},{"number":4,"text":"thoroughly"}],"answer_number":3,"answer_text":"intentionally","answer_status":"official","answer_source":"https://www.eiken.or.jp/eiken/result/pdf/202501Fp1kyu.pdf","source_file":"問題冊子(20261011-053921).pdf","source_page":4},{"id":"2025-1-pre1-q13","grade":"準1級","year":2025,"session":1,"section":1,"question_number":13,"question":"In some countries, it is the (____) of families, not the government, to financially support senior citizens.","choices":[{"number":1,"text":"component"},{"number":2,"text":"obligation"},{"number":3,"text":"symptom"},{"number":4,"text":"resolution"}],"answer_number":2,"answer_text":"obligation","answer_status":"official","answer_source":"https://www.eiken.or.jp/eiken/result/pdf/202501Fp1kyu.pdf","source_file":"問題冊子(20261011-053921).pdf","source_page":4},{"id":"2025-1-pre1-q14","grade":"準1級","year":2025,"session":1,"section":1,"question_number":14,"question":"Although many people like t <script>'use strict';
const TrainerCore = (() => {
  const blank = () => ({version:1,records:{},session:null,settings:{grade:'準2級',source:'all',count:10},updatedAt:0});
  const stat = (state,id) => state.records[id] || {attempts:0,mistakes:0,correct:0,pending:false,lastChoice:null,lastCorrect:null,updatedAt:0};
  function pool(questions,state,mode,filter=0) {
    return questions.filter(q => (!state.settings.grade || q.grade===state.settings.grade) && (state.settings.source!=='official' || q.answer_status==='official') && (mode==='new' ? stat(state,q.id).attempts===0 : (mode==='series' ? stat(state,q.id).mistakes>=Math.max(1,filter) : stat(state,q.id).pending)));
  }
  function shuffle(items,rng=Math.random) {const a=[...items]; for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function begin(state,ids,mode,now=Date.now()) {
    if(!ids.length) return false;
    state.session={id:String(now),mode,ids:[...new Set(ids)],index:0,answers:[],startedAt:now};return true;
  }
  function answer(state,question,choice,now=Date.now()) {
    const s=state.session;
    if(!s || s.ids[s.index]!==question.id || s.answers.length!==s.index || ![0,1,2,3,4].includes(choice)) return null;
    const correct=choice===question.answer_number, old=stat(state,question.id);
    state.records[question.id]={attempts:old.attempts+1,mistakes:old.mistakes+(correct?0:1),correct:old.correct+(correct?1:0),pending:!correct,lastChoice:choice,lastCorrect:correct,updatedAt:now};
    const result={id:question.id,choice,correct,at:now,wasPending:old.pending};s.answers.push(result);state.updatedAt=now;return result;
  }
  function advance(state) {const s=state.session;if(!s || s.answers.length!==s.index+1)return false;s.index++;return true;}
  function retryIds(state) {return (state.session?.answers||[]).filter(a=>!a.correct && stat(state,a.id).pending).map(a=>a.id);}
  function validate(input,questions) {
    if(!input || input.version!==1 || !input.records || typeof input.records!=='object' || Array.isArray(input.records))throw Error('対応していない記録ファイルです。');
    const valid=new Map(questions.map(q=>[q.id,q]));const out=blank();
    const integer=x=>Number.isSafeInteger(x)&&x>=0&&x<=1000000;
    for(const [id,r] of Object.entries(input.records)) {
      if(!valid.has(id))continue;
      if(!r || !integer(r.attempts)||!integer(r.mistakes)||!integer(r.correct)||r.attempts!==r.mistakes+r.correct||r.attempts<1||typeof r.pending!=='boolean'||typeof r.lastCorrect!=='boolean'||r.pending===r.lastCorrect||![0,1,2,3,4].includes(r.lastChoice)||!Number.isFinite(r.updatedAt)||r.mistakes<(r.pending?1:0)||r.correct<(r.lastCorrect?1:0))throw Error('記録データの形式が正しくありません。');
      out.records[id]={attempts:r.attempts,mistakes:r.mistakes,correct:r.correct,pending:r.pending,lastChoice:r.lastChoice,lastCorrect:r.lastCorrect,updatedAt:r.updatedAt};
    }
    const cfg=input.settings||{};out.settings={grade:['4級','3級','準2級','2級','準1級',''].includes(cfg.grade)?cfg.grade:'準2級',source:cfg.source==='official'?'official':'all',count:[5,10,20,50,0].includes(cfg.count)?cfg.count:10};
    const s=input.session;
    if(s) {
      if(!Array.isArray(s.ids)||!s.ids.length||s.ids.length>questions.length||new Set(s.ids).size!==s.ids.length||s.ids.some(id=>!valid.has(id))||!integer(s.index)||s.index>s.ids.length||!Array.isArray(s.answers)||s.answers.length<s.index||s.answers.length>Math.min(s.index+1,s.ids.length)||!['new','review','series'].includes(s.mode))throw Error('途中の学習記録が正しくありません。');
      const answers=s.answers.map((a,i)=>{if(!a||a.id!==s.ids[i]||![0,1,2,3,4].includes(a.choice)||typeof a.correct!=='boolean'||a.correct!==(a.choice===valid.get(a.id).answer_number)||!Number.isFinite(a.at)||!out.records[a.id])throw Error('回答記録が正しくありません。');return {id:a.id,choice:a.choice,correct:a.correct,at:a.at,wasPending:!!a.wasPending};});
      out.session={id:String(s.id),mode:s.mode,ids:s.ids.slice(),index:s.index,answers,startedAt:Number(s.startedAt)||0};
    }
    out.updatedAt=Number(input.updatedAt)||0;return out;
  }
  return {blank,stat,pool,shuffle,begin,answer,advance,retryIds,validate};
})();
if(typeof module!=='undefined')module.exports=TrainerCore;
</script>
<script>'use strict';
const QUESTIONS=JSON.parse(document.getElementById('question-data').textContent);
const BY_ID=new Map(QUESTIONS.map(q=>[q.id,q]));
const KEY='eiken-retry-notebook-v1';
const C=TrainerCore;
const app=document.getElementById('app');
let state=C.blank(),page='home',series=1,recordFilter='mistakes',toastTimer,readOnly=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showAlert(message){const el=document.getElementById('storageAlert');el.textContent=message;el.hidden=false;}
try{const raw=localStorage.getItem(KEY);if(raw)state=C.validate(JSON.parse(raw),QUESTIONS);}catch(e){readOnly=true;showAlert('保存された記録を読み込めませんでした。元の記録を保護するため、保存を停止しています。「記録」からバックアップを取り込むか、初期化してください。');}
function persist(){if(readOnly)return false;try{state.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){showAlert('記録をブラウザに保存できません。この画面では学習を続けられますが、閉じる前に「記録を保存」でバックアップしてください。');return false;}}
function toast(message){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,4500);}
const stats=q=>C.stat(state,q.id);
function scope(){return QUESTIONS.filter(q=>(!state.settings.grade||q.grade===state.settings.grade)&&(state.settings.source!=='official'||q.answer_status==='official'));}
function selected(value,current){return value===current?' selected':'';}
function filters(withCount=false){return `<div class="filters"><label>出題する級<select id="grade">${['4級','3級','準2級','2級','準1級',''].map(g=>`<option value="${g}"${selected(g,state.settings.grade)}>${g||'すべて'} · ${QUESTIONS.filter(q=>!g||q.grade===g).length}問</option>`).join('')}</select></label><label>解答の範囲<select id="source"><option value="all"${selected('all',state.settings.source)}>すべての問題</option><option value="official"${selected('official',state.settings.source)}>公式解答のある問題のみ</option></select></label>${withCount?`<label>新しい問題の出題数<select id="count">${[5,10,20,50,0].map(n=>`<option value="${n}"${selected(n,state.settings.count)}>${n?n+'問':'未挑戦のすべて'}</option>`).join('')}</select></label>`:''}</div>`;}
function answerLabel(q){return q.answer_status==='official'?'公式解答':q.answer_status==='external_key'?'外部の解答例（非公式）':'AIによる暫定解答';}
function sourceNote(){return '';}
function sourceLink(q){return '';}
function navigate(next){page=next;render();window.scrollTo({top:0,behavior:'instant'});}
function resumeBlock(){const s=state.session;if(!s)return '';const finished=s.index>=s.ids.length;return `<div class="resume"><div><b>${finished?'前回の結果を確認できます':'途中の学習が残っています'}</b><div class="note">${s.mode==='new'?'新しい問題':s.mode==='series'?'間違えた問題シリーズ':'間違えた問題の解き直し'} · ${s.answers.length} / ${s.ids.length}問 回答済み</div></div><button class="btn secondary" data-action="resume">${finished?'結果を見る':'続きから再開'} →</button></div>`;}
function home(){const qs=scope(),fresh=qs.filter(q=>!stats(q).attempts).length,ever=qs.filter(q=>stats(q).mistakes>0).length,pending=qs.filter(q=>stats(q).pending).length,correct=qs.filter(q=>stats(q).lastCorrect===true).length;return `<section class="hero"><div><div class="eyebrow">SMALL STEPS. LASTING PROGRESS.</div><h1>間違いを、<br>自分だけの問題集に。</h1><p>一度間違えた問題は、正解してもずっと残る。<br>苦手の深さに合わせて、何度でも解き直そう。</p></div><div class="hero-seal" aria-hidden="true"><span>YOUR RETRY NOTE</span><b>↻</b><span>ひとつずつ、できるへ。</span></div></section>${resumeBlock()}${filters(true)}<div class="stats"><div class="stat"><span>未挑戦</span><b>${fresh}</b><em>問</em></div><div class="stat hot"><span>一度でも間違えた</span><b>${ever}</b><em>問</em></div><div class="stat"><span>直近の回答が不正解</span><b>${pending}</b><em>問</em></div><div class="stat"><span>直近の回答が正解</span><b>${correct}</b><em>問</em></div></div><div class="grid"><section class="panel feature"><div class="eyebrow">01 / PRACTICE</div><h2>新しい問題に挑戦</h2><p>まだ解いていない問題からランダムに出題。回答すると、その場で正誤と完成した英文を確認できます。</p><button class="btn" data-action="start-new"${fresh?'':' disabled'}>${fresh?'学習を始める →':'この範囲の未挑戦はありません'}</button></section><section class="panel feature primary"><div class="eyebrow">02 / MY RETRY SERIES</div><h2>間違えた問題シリーズ</h2><p>１回以上・２回以上・３回以上…。過去に間違えた回数を選んで、苦手な問題をまとめて解き直そう。</p><button class="btn" data-page="review">シリーズを選ぶ <span aria-hidden="true">↗</span></button></section></div><div class="steps"><div class="step"><b>01</b>まずは解く</div><div class="step"><b>02</b>間違いを蓄積</div><div class="step"><b>03</b>選んで解き直す</div></div><p class="note">「新しい問題」は未挑戦だけ。シリーズへの所属は、復習で正解しても消えません。</p>${sourceNote()}`;}
function questionRow(q,showAnswer=false){const r=stats(q);return `<div class="list-row"><div><small>${esc(q.grade)} · ${q.year}年度 第${q.session}回 · 問${q.question_number}　／　累計${r.mistakes}回ミス</small><p>${esc(q.question.replace('(____)','（　　）'))}</p>${showAnswer?`<div class="note">解答：${q.answer_number}. ${esc(q.answer_text)}　${answerLabel(q)}</div>`:''}</div><span class="status${r.lastCorrect?' done':''}">${r.lastCorrect?'直近は正解':'直近は不正解'}</span></div>`;}
function review(){const qs=scope(),max=Math.max(3,...qs.map(q=>stats(q).mistakes)),levels=[...new Set([...Array.from({length:Math.min(max,20)},(_,i)=>i+1),...qs.map(q=>stats(q).mistakes).filter(n=>n>20)])].sort((a,b)=>a-b);const pool=series===0?C.pool(QUESTIONS,state,'review'):C.pool(QUESTIONS,state,'series',series);return `<section class="section-head"><div class="eyebrow">MY RETRY SERIES</div><h1>間違いは、学びの記録。</h1><p>正解した後も、シリーズからは外れません。いつでも選んで復習できます。</p></section>${filters()}<div class="chips" role="group" aria-label="間違えた回数を選ぶ">${levels.map(n=>`<button class="chip${series===n?' active':''}" data-series="${n}" aria-pressed="${series===n}">${n}回以上間違えた<b>${qs.filter(q=>stats(q).mistakes>=n).length}</b></button>`).join('')}<button class="chip${series===0?' active':''}" data-series="0" aria-pressed="${series===0}">直近の不正解だけ<b>${qs.filter(q=>stats(q).pending).length}</b></button></div><section class="panel"><div class="row spread"><div><span class="tag">${series?`累計${series}回以上のミス`:'現在の苦手'}</span><h2 style="margin-top:10px">${series?`${series}回以上間違えた問題`:'直近の回答が不正解の問題'}</h2><p class="muted" style="margin-top:8px">${pool.length}問 ${series?'· 復習で正解した問題も含みます':'· 正解した問題はここから外れます'}</p></div><button class="btn" data-action="start-series"${pool.length?'':' disabled'}>この${pool.length}問を解き直す →</button></div>${pool.length?`<p class="note" style="margin-top:18px">全${pool.length}問をランダムな順番で出題します。終了後は「今回間違えた問題だけ」も選べます。</p><details><summary>このシリーズの問題を見る</summary><div class="list">${pool.map(q=>questionRow(q)).join('')}</div></details>`:'<div class="empty"><div class="empty-symbol" aria-hidden="true">◎</div><h3>このシリーズは、まだ０問です。</h3><p>学習中の間違いが自動で記録されます。</p><button class="btn secondary" data-page="home">新しい問題に進む</button></div>'}</section><div class="notice">回数は累計です。２回間違えた問題は「１回以上」と「２回以上」の両方に入ります。正解しても、ミス回数は減りません。</div>${sourceNote()}`;}
function newSession(mode,ids){if(!ids.length){toast('対象の問題がありません。');return;}if(state.session && state.session.index<state.session.ids.length && !confirm('途中の学習を終了して、新しく始めますか？これまでの回答とミス回数は残ります。'))return;C.begin(state,C.shuffle(ids),mode);persist();navigate('quiz');}
function questionHtml(text){return esc(text).replace(/\(____\)/g,'<span class="blank" aria-label="空所">?</span>').replace(/\s+([AB])\s*:/g,'\n$1:');}
function quiz(){const s=state.session;if(!s)return '<section class="panel empty"><h2>学習を始めましょう</h2><button class="btn" data-page="home">学習へ</button></section>';if(s.index>=s.ids.length)return summaryView();const q=BY_ID.get(s.ids[s.index]),a=s.answers[s.index],r=stats(q);return `<div class="quiz-wrap"><div class="row spread"><button class="btn ghost" data-page="home">← 保存して戻る</button><span class="tag">${s.mode==='new'?'新しい問題':s.mode==='series'?'間違えた問題シリーズ':'今回間違えた問題の復習'}</span></div><div class="progress-line"><span>問題 ${s.index+1} / ${s.ids.length}</span><span>${s.answers.filter(a=>a.correct).length}問 正解</span></div><div class="progress" role="progressbar" aria-label="学習の進み具合" aria-valuenow="${s.answers.length}" aria-valuemin="0" aria-valuemax="${s.ids.length}"><i style="width:${s.answers.length/s.ids.length*100}%"></i></div><section class="panel quiz-card"><div class="row spread"><small class="muted">${esc(q.grade)} · ${q.year}年度 第${q.session}回 · 問${q.question_number}</small><span class="tag">${r.mistakes?'累計 '+r.mistakes+'回ミス':'初めての一歩'}</span></div><div class="question" id="question">${questionHtml(q.question)}</div><div class="options" role="group" aria-labelledby="question">${q.choices.map(c=>`<button class="option${a?(c.number===q.answer_number?' correct':c.number===a.choice?' wrong':''):''}" data-choice="${c.number}"${a?' disabled':''}><span class="num">${c.number}</span><span class="word">${esc(c.text)}</span>${a&&c.number===q.answer_number?'<span aria-label="正解">✓</span>':a&&c.number===a.choice?'<span aria-label="不正解">×</span>':''}</button>`).join('')}</div>${a?feedback(q,a,r):'<button class="btn ghost" style="margin-top:18px;width:100%" data-choice="0">わからない · 間違いとして記録</button>'}<p class="bottom-note">回答は選択時に記録されます</p></section></div>`;}
function feedback(q,a,r){return `<div id="feedback" class="feedback${a.correct?'':' wrong'}" role="status" tabindex="-1"><h3>${a.correct?'✓ 正解！':'もう一度、覚えよう。'}</h3><div>解答：<strong class="answer">${q.answer_number}. ${esc(q.answer_text)}</strong></div>${!a.correct?`<p class="note">あなたの回答：${a.choice?esc(q.choices[a.choice-1].text):'わからない'}</p>`:''}<div class="filled">${esc(q.question).replace('(____)',`<strong>${esc(q.answer_text)}</strong>`).replace(/\s+([AB])\s*:/g,'\n$1:')}</div><div id="choiceTranslations" style="margin-top:18px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px"><b>すべての選択肢の意味</b><div class="note" style="margin-top:8px">日本語訳を読み込んでいます…</div></div><div id="quickTip" style="margin-top:12px;padding:14px 16px;background:#f7f3df;border-radius:12px"><b>💡 ワンポイント</b><div class="note" style="margin-top:6px">正解語と文脈を確認中です…</div></div><p class="note" style="margin-top:14px">${a.correct?(r.mistakes?`今回の解き直しはクリア。「${r.mistakes}回以上間違えた問題」までのシリーズには引き続き残ります。`:'この問題は「新しい問題」から外れます。'): `累計${r.mistakes}回のミスとして記録しました。終了後、今回間違えた問題だけを解き直せます。`}</p><button id="next" class="btn" data-action="next">${state.session.index+1===state.session.ids.length?'結果を見る':'次の問題へ'} →</button></div>`;}
function summaryView(){const s=state.session,total=s.answers.length,correct=s.answers.filter(a=>a.correct).length,retry=C.retryIds(state);return `<div class="quiz-wrap"><section class="panel summary"><div class="eyebrow">ROUND COMPLETE</div><h1>${retry.length?'ここから、もうひと伸び。':'この回はクリア！'}</h1><div class="summary-score">${correct}<span> / ${total}問 正解</span></div><p>${retry.length?`次に取り組むのは、今回間違えた${retry.length}問だけ。`:'今回の全問に正解しました。おつかれさまでした！'}</p><p class="note">過去のミス回数と、間違えた問題シリーズはそのまま残ります。</p><div class="summary-actions">${retry.length?`<button class="btn" data-action="retry-round">今回間違えた${retry.length}問だけ解く ↻</button>`:''}<button class="btn secondary" data-page="review">シリーズを選び直す</button><button class="btn ghost" data-page="home">ホームへ</button></div></section><details class="panel" style="margin-top:20px"><summary>この回の回答を確認する</summary>${s.answers.map(a=>{const q=BY_ID.get(a.id);return `<div class="list-row"><div><small>${q.year}年度 第${q.session}回 · 問${q.question_number}</small><p>${esc(q.question)}</p><div class="note">あなた：${a.choice?esc(q.choices[a.choice-1].text):'わからない'} ／ 解答：${esc(q.answer_text)}</div></div><span class="status${a.correct?' done':''}">${a.correct?'正解':'不正解'}</span></div>`;}).join('')}</details></div>`;}
function history(){const qs=scope(),all=qs.filter(q=>stats(q).attempts),ever=all.filter(q=>stats(q).mistakes),misses=all.reduce((sum,q)=>sum+stats(q).mistakes,0),attempts=all.reduce((sum,q)=>sum+stats(q).attempts,0);const listed=(recordFilter==='all'?all:ever).sort((a,b)=>stats(b).mistakes-stats(a).mistakes);return `<section class="section-head"><div class="eyebrow">YOUR LEARNING LOG</div><h1>積み重ねた、学び。</h1><p>正解できた後も、これまでの間違いを記録し続けます。</p></section>${filters()}<div class="stats"><div class="stat"><span>挑戦した問題</span><b>${all.length}</b><em>問</em></div><div class="stat"><span>回答した回数</span><b>${attempts}</b><em>回</em></div><div class="stat hot"><span>間違えた問題</span><b>${ever.length}</b><em>問</em></div><div class="stat"><span>累計のミス</span><b>${misses}</b><em>回</em></div></div><section class="panel"><div class="row spread"><h2>問題ごとの記録</h2><label class="note">表示 <select id="recordFilter"><option value="mistakes"${selected('mistakes',recordFilter)}>一度でも間違えた問題</option><option value="all"${selected('all',recordFilter)}>挑戦した全問題</option></select></label></div>${listed.length?`<div class="list">${listed.map(q=>questionRow(q,true)).join('')}</div>`:'<div class="empty"><p>まだ記録がありません。</p></div>'}</section><section class="panel data-block"><h2>記録を持ち運ぶ</h2><p>この端末・ブラウザに自動保存します。別の端末へ移すときや、ブラウザのデータを消す前には、記録ファイルを保存してください。保存・取り込みの対象は、選択中の級に関係なく全記録です。</p><div class="row"><button class="btn secondary" data-action="export">記録を保存</button><button class="btn ghost" data-action="import">記録を取り込む</button></div><details><summary>収録問題と解答について</summary><p>４級・３級・準２級・２級・準１級、計${QUESTIONS.length}問を収録しています。公式解答を優先し、入手できなかった回は外部の解答例（非公式）またはAIによる暫定解答を使用しています。採点に使う解答は、各問題の回答後に表示します。公式解答のみを使う場合は、上の「解答の範囲」で切り替えてください。</p><p>シリーズは累計のミス回数で決まります。例：不正解 → 正解 → 不正解なら２回ミス。「１回以上」と「２回以上」の両方に入ります。</p></details><details><summary>記録の初期化</summary><p>すべての級のミス回数・回答記録・途中の学習を削除します。必要なら先に記録を保存してください。</p><button class="btn danger" data-action="reset">すべての学習記録を削除</button></details></section>`;}
const TRANSLATION_CACHE_KEY='eiken-choice-ja-cache-v1';
let translationCache={};try{translationCache=JSON.parse(localStorage.getItem(TRANSLATION_CACHE_KEY)||'{}')}catch{}
async function jaTranslate(text){
 if(translationCache[text])return translationCache[text];
 try{
  const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q='+encodeURIComponent(text);
  const res=await fetch(u);if(!res.ok)throw Error('translate');
  const data=await res.json();const ja=(data[0]||[]).map(x=>x[0]).join('').trim();
  if(ja){translationCache[text]=ja;try{localStorage.setItem(TRANSLATION_CACHE_KEY,JSON.stringify(translationCache))}catch{};return ja;}
 }catch(e){}
 return '訳を取得できませんでした';
}
async function loadLearningHelp(q){
 const box=document.getElementById('choiceTranslations'),tip=document.getElementById('quickTip');if(!box)return;
 const jas=await Promise.all(q.choices.map(c=>jaTranslate(c.text)));
 if(!document.getElementById('choiceTranslations'))return;
 box.innerHTML='<b>すべての選択肢の意味</b>'+q.choices.map((c,i)=>`<div style="display:grid;grid-template-columns:28px 1fr;gap:8px;margin-top:8px"><b>${c.number}</b><div><span style="font-family:Georgia,serif">${esc(c.text)}</span> <span class="muted">＝ ${esc(jas[i])}</span></div></div>`).join('');
 const correctJa=jas[q.answer_number-1];
 tip.innerHTML=`<b>💡 ワンポイント</b><div style="margin-top:6px"><strong>${esc(q.answer_text)}</strong> は「${esc(correctJa)}」という意味。前後の文脈に入れると最も自然です。<br><span class="note">選択肢は単語だけでなく、完成した英文の意味まで確認すると定着しやすくなります。</span></div>`;
}
function render(){document.querySelectorAll('nav [data-page]').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});app.innerHTML=page==='home'?home():page==='review'?review():page==='history'?history():quiz();if(page==='quiz'&&state.session&&state.session.index<state.session.ids.length&&state.session.answers[state.session.index]){const q=BY_ID.get(state.session.ids[state.session.index]);if(q)setTimeout(()=>loadLearningHelp(q),0);}}
function exportState(){const payload={...state,app:'eiken-retry-notebook',exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eiken-learning-record-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('記録ファイルを保存しました。');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return;}if(b.dataset.series!==undefined){series=Number(b.dataset.series);render();return;}if(b.dataset.choice!==undefined){const s=state.session;if(!s)return;const q=BY_ID.get(s.ids[s.index]);if(!q)return;if(C.answer(state,q,Number(b.dataset.choice))){persist();render();loadLearningHelp(q);document.getElementById('feedback')?.focus({preventScroll:false});}return;}switch(b.dataset.action){case'start-new':{let qs=C.pool(QUESTIONS,state,'new');qs=C.shuffle(qs);if(state.settings.count)qs=qs.slice(0,state.settings.count);newSession('new',qs.map(q=>q.id));break;}case'start-series':newSession(series?'series':'review',C.pool(QUESTIONS,state,series?'series':'review',series).map(q=>q.id));break;case'resume':navigate('quiz');break;case'next':if(C.advance(state)){persist();render();window.scrollTo({top:0,behavior:'instant'});}break;case'retry-round':newSession('review',C.retryIds(state));break;case'export':exportState();break;case'import':document.getElementById('importFile').click();break;case'reset':if(confirm('すべての級の学習記録を削除します。元に戻せません。削除しますか？')){state=C.blank();readOnly=false;try{localStorage.removeItem(KEY);document.getElementById('storageAlert').hidden=true;}catch{}persist();navigate('home');toast('学習記録を初期化しました。');}break;}});
document.addEventListener('change',e=>{if(['grade','source','count'].includes(e.target.id)){state.settings[e.target.id]=e.target.id==='count'?Number(e.target.value):e.target.value;persist();render();}if(e.target.id==='recordFilter'){recordFilter=e.target.value;render();}});
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('ファイルが大きすぎます。');const incoming=JSON.parse(await f.text());if(incoming.app!=='eiken-retry-notebook')throw Error('このアプリの記録ファイルを選んでください。');const restored=C.validate(incoming,QUESTIONS);if(!confirm('この端末の全学習記録を、ファイルの記録で置き換えますか？'))return;state=restored;readOnly=false;document.getElementById('storageAlert').hidden=true;const saved=persist();navigate('history');toast(saved?'学習記録を取り込みました。':'取り込みましたが、自動保存できません。');}catch(err){alert('取り込めませんでした：'+err.message);}finally{e.target.value='';}});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{state=e.newValue?C.validate(JSON.parse(e.newValue),QUESTIONS):C.blank();render();toast('別のタブで更新された記録を読み込みました。');}catch{showAlert('別のタブの記録を読み込めません。画面を再読み込みしてください。');readOnly=true;}});
render();
</script>
</body></html>
